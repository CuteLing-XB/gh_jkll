name: Auto Obfuscate Lua

on:
  push:
    paths:
      - 'input/*.lua'

permissions:
  contents: write # 🌟 开启写入权限，防止 GitHub 拦截 Commit

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Prometheus
        run: |
          git clone --depth 1 https://github.com/prometheus-lua/Prometheus.git prometheus-tool
          cd prometheus-tool
          npm install

      - name: Run Obfuscation
        run: |
          mkdir -p output
          for file in input/*.lua; do
            filename=$(basename "$file")
            # 自动探测并兼容所有可能的 CLI 入口路径与参数格式
            if [ -f "prometheus-tool/CLI.js" ]; then
              node prometheus-tool/CLI.js "$file" -o "output/$filename"
            elif [ -f "prometheus-tool/cli.js" ]; then
              node prometheus-tool/cli.js --input "$file" --output "output/$filename"
            else
              node prometheus-tool/index.js --input "$file" --output "output/$filename"
            fi
          done

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-obfuscated via Prometheus" || exit 0
          git push
