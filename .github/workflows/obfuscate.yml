name: Auto Obfuscate Lua

on:
  push:
    paths:
      - 'input/*.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Obfuscator
        run: |
          mkdir -p output
          python3 -c '
          import os, base64, random

          # 简单的异或加密混淆器
          for file in os.listdir("input"):
              if file.endswith(".lua"):
                  in_path = os.path.join("input", file)
                  out_path = os.path.join("output", file)
                  with open(in_path, "r", encoding="utf-8") as f:
                      code = f.read()
                  
                  # 随机密钥进行异或混淆 + Base64 编码
                  key = random.randint(1, 255)
                  encoded_bytes = [(ord(c) ^ key) for c in code]
                  b64_str = base64.b64encode(bytes(encoded_bytes)).decode("utf-8")
                  
                  # 生成一段自解密的 Lua 代码
                  obfuscated = f"""-- Auto Obfuscated Script
          local _k = {key}
          local _b = "{b64_str}"
          local function _d(data, k)
              local b = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
              local function g(x)
                  if x == "=" then return "" end
                  local r, f = "", (b:find(x)-1)
                  for i=6,1,-1 do r=r..(f%2^i - f%2^(i-1) > 0 and "1" or "0") end
                  return r
              end
              local bit = bit32 or {{bxor = function(a,b) return (a+b)%256 end}}
              return (data:gsub("[^"..b.."=]", ""):gsub(".", g):gsub("%d%d%d%d%d%d%d%d", function(x)
                  local c=0
                  for i=1,8 do c=c+(x:sub(i,i)=="1" and 2^(8-i) or 0) end
                  return string.char(bit.bxor(c, k))
              end))
          end
          load(_d(_b, _k))()
          """
                  with open(out_path, "w", encoding="utf-8") as f:
                      f.write(obfuscated)
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-obfuscated script" || exit 0
          git push
