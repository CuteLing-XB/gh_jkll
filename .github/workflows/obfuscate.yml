name: Auto Obfuscate Lua

on:
  push:
    paths:
      - 'input/*.lua'
  workflow_dispatch: # 支持在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. 克隆最新版 Prometheus 并构建编译
      - name: Clone and Build Prometheus
        run: |
          git clone --depth 1 https://github.com/prometheus-lua/Prometheus.git prometheus-tool
          cd prometheus-tool
          npm install
          npm run build || true
          npm link || npm install -g .

      # 2. 调用编译好的 Prometheus CLI 执行混淆
      - name: Run Obfuscation
        run: |
          mkdir -p output
          for file in input/*.lua; do
            filename=$(basename "$file")
            # 使用全局链接的 prometheus 命令或打包后的入口
            npx prometheus "$file" --preset Pipeline -o "output/$filename" || \
            node prometheus-tool/dist/cli.js "$file" -o "output/$filename" || \
            node prometheus-tool/CLI.js "$file" -o "output/$filename"
          done

      # 3. 提交加密后的脚本到 output 文件夹
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-obfuscated via Prometheus" || exit 0
          git push
